<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kmetija Grobelnik — AI pomočnik</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #3a5a20;
    }
    .hero-img {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      object-fit: cover;
      object-position: center center;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(60,90,30,0.55) 0%, rgba(60,90,30,0.20) 60%, transparent 100%);
    }
  </style>
</head>
<body>
  <div class="hero">
    <img class="hero-img" src="/static/bg.jpg" alt="Kmetija Grobelnik">
    <div class="hero-overlay"></div>
  </div>
  <script src="/static/widget.js?v=2"></script>
</body>
</html>
